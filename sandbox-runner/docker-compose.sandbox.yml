# HireOS SQL assessment sandbox — a separate Postgres server that holds only
# synthetic assessment datasets. It is NOT the HireOS database and never sees
# application credentials. Published on 127.0.0.1 only.
#
#   node scripts/sandbox-setup.mjs      (generates secrets, builds image, starts this)
#
# Credentials come from sandbox-runner/.env (git-ignored).

services:
  sql-sandbox:
    image: pgvector/pgvector:pg16
    container_name: hireos-sql-sandbox
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SQL_SANDBOX_ADMIN_USER:-sandbox_admin}
      POSTGRES_PASSWORD: ${SQL_SANDBOX_ADMIN_PASSWORD:?Run node scripts/sandbox-setup.mjs}
      POSTGRES_DB: ${SQL_SANDBOX_ADMIN_DB:-sandbox_admin}
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=64MB
      - -c
      - statement_timeout=10000
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
    ports:
      - "127.0.0.1:${SQL_SANDBOX_PORT:-55433}:5432"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - sqlsandbox
    volumes:
      - hireos_sql_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  sqlsandbox:
    name: hireos-sql-sandbox-net

volumes:
  hireos_sql_sandbox_data:
